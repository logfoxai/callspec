name: Release

# Triggered by CI completing successfully on main/next. CI is the gate; release
# never runs unless CI passed. This catches admin force-pushes that bypass checks.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, next]

permissions:
  id-token: write   # Required for npm trusted publishing (OIDC)
  contents: write   # Required for autorel to push release tag (and changelog)

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'   # npm 11+ required for trusted publishing (OIDC)
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npx autorel@^2 --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
