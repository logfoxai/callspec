<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      font-family: Inter, system-ui, sans-serif;
      color: #1f1f1f;
      -webkit-font-smoothing: antialiased;
    }

    /* Fern-style: inputs → center → output, dotted connectors, no page chrome */
    .diagram {
      width: 920px;
      padding: 8px 12px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
    }

    .node {
      flex: 1;
      max-width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .node img { display: block; }

    .node-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .node-sub {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      max-width: 220px;
    }

    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      line-height: 1.5;
      color: #444;
      background: rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      padding: 8px 10px;
      text-align: left;
      width: 100%;
    }

    .outputs {
      width: 100%;
      font-size: 11px;
      text-align: left;
    }

    .outputs div {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .outputs div:last-child { border-bottom: none; }
    .outputs strong { font-weight: 600; }
    .outputs span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: #888;
    }

    .langs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
    }
    .langs span {
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(81,194,51,0.12);
      color: #2d6b1f;
    }

    .connector {
      flex: 0 0 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      align-self: center;
    }

    .connector svg { display: block; }

    .connector-label {
      position: absolute;
      top: calc(50% - 22px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #3da828;
      white-space: nowrap;
    }

    .optional .node-title { color: #1f1f1f; }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="node">
      <img src="mark-light.svg" height="28" alt="" />
      <div class="node-title">route + spec</div>
      <div class="node-sub">TypeScript + runtyp</div>
      <div class="code">
        route({ input, output, meta, resolver })<br/>
        spec({ routes })
      </div>
    </div>

    <div class="connector">
      <svg width="56" height="12" viewBox="0 0 56 12" fill="none">
        <line x1="0" y1="6" x2="48" y2="6" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M48 6 L42 2.5 V9.5 Z" fill="#bbb"/>
      </svg>
    </div>

    <div class="node">
      <img src="callspec-lockup-light.svg" height="28" alt="callspec" />
      <div class="node-title">mountSpec + CLI</div>
      <div class="node-sub">Docs, OpenAPI, MCP, TS SDK</div>
      <div class="outputs">
        <div><strong>Docs</strong><span>/docs</span></div>
        <div><strong>OpenAPI</strong><span>/openapi.json</span></div>
        <div><strong>MCP</strong><span>/mcp</span></div>
        <div><strong>TS SDK</strong><span>CLI</span></div>
      </div>
    </div>

    <div class="connector">
      <span class="connector-label">OpenAPI</span>
      <svg width="56" height="12" viewBox="0 0 56 12" fill="none">
        <line x1="0" y1="6" x2="48" y2="6" stroke="#51c233" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M48 6 L42 2.5 V9.5 Z" fill="#51c233"/>
      </svg>
    </div>

    <div class="node optional">
      <img src="fern-logo.svg" height="28" alt="Fern" />
      <div class="node-title">fern generate</div>
      <div class="node-sub">Optional multi-lang SDKs</div>
      <div class="langs">
        <span>Python</span><span>Go</span><span>Java</span><span>Ruby</span><span>C#</span>
      </div>
      <div class="code">
        fern init --openapi ./openapi.json<br/>
        fern generate
      </div>
    </div>
  </div>
</body>
</html>
