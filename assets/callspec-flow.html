<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .diagram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 28px 36px;
      background: #fff;
    }

    .flow {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .step img { display: block; }
    .step.define img { height: 34px; }
    .step.generate img { height: 26px; }

    .label {
      font-size: 13px;
      font-weight: 600;
      color: #171717;
    }

    .hint {
      font-size: 12px;
      color: #737373;
    }

    .arrow {
      color: #a3a3a3;
      font-size: 16px;
      line-height: 1;
      user-select: none;
    }

    .outputs .label {
      font-weight: 500;
      color: #525252;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="diagram">
    <div class="flow">
      <div class="step define">
        <img src="mark-light.svg" alt="" />
        <div class="label">Define</div>
        <div class="hint">route + spec</div>
      </div>

      <div class="arrow" aria-hidden="true">→</div>

      <div class="step generate">
        <img src="callspec-lockup-light.svg" alt="callspec" />
        <div class="hint">mountSpec + CLI</div>
      </div>

      <div class="arrow" aria-hidden="true">→</div>

      <div class="step outputs">
        <div class="label">API · TS SDK · MCP · Docs</div>
      </div>
    </div>
  </div>
</body>
</html>
